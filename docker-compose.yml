version: '3.3'
services:
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_RESTART_POLICY=always
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=42247710-6003-490b-936b-67a6d8d65451
      - DATABASE_ENABLED=false # Na v1.8 podemos rodar sem DB externo para testes rápidos
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO
      - LOG_COLOR=true
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
